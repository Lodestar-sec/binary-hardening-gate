name: CI

# Stack-independent delivery pipeline. Language-specific jobs (lint, unit/integration tests,
# migrations, E2E) are added in phase 6 and wired in as dependencies of `ephemeral-deploy`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERFILE: Dockerfile
  CHART_DIR: deploy/helm
  # Service port and readiness path; keep in sync with deploy/helm/values.yaml.
  APP_PORT: "8080"
  READY_PATH: /readyz

jobs:
  detect:
    name: Detect deployable app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_chart: ${{ steps.check.outputs.has_chart }}
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Dockerfile and chart
        id: check
        run: |
          has_chart=false; deployable=false
          [[ -f "$CHART_DIR/Chart.yaml" ]] && has_chart=true
          [[ "$has_chart" == true && -f "$DOCKERFILE" ]] && deployable=true
          echo "has_chart=$has_chart" >> "$GITHUB_OUTPUT"
          echo "deployable=$deployable" >> "$GITHUB_OUTPUT"
          if [[ "$deployable" != true ]]; then
            echo "::notice::No $DOCKERFILE yet: image, deployment, and DAST stages are skipped until the walking skeleton (phase 6)."
          fi

  lint-chart:
    name: Lint Helm chart
    needs: detect
    if: needs.detect.outputs.has_chart == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint and render
        run: |
          helm lint --strict "$CHART_DIR"
          helm template ci "$CHART_DIR" > /dev/null

  build:
    name: Build image
    needs: detect
    if: needs.detect.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          tags: ci.local/app:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  scan-image:
    name: Scan image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Scan to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload to code scanning
        # Fork PRs get a read-only token and cannot upload results.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Gate on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  ephemeral-deploy:
    name: Ephemeral deploy and DAST
    needs: [lint-chart, scan-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Helm release name = repository name, so the Service is addressable as svc/<repo>.
      RELEASE: ${{ github.event.repository.name }}
      NAMESPACE: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ci

      - name: Load image into cluster
        run: kind load image-archive "$RUNNER_TEMP/image.tar" --name ci

      - name: Deploy chart
        run: |
          helm upgrade --install "$RELEASE" "$CHART_DIR" \
            --namespace "$NAMESPACE" --create-namespace \
            --set image.repository=ci.local/app \
            --set image.tag="$GITHUB_SHA" \
            --set image.pullPolicy=Never \
            --wait --timeout 5m

      - name: Helm tests
        run: helm test "$RELEASE" --namespace "$NAMESPACE" --logs --timeout 3m

      - name: Expose service on localhost
        run: |
          kubectl -n "$NAMESPACE" port-forward "svc/$RELEASE" 8080:"$APP_PORT" > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:8080$READY_PATH" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::Service is not reachable on localhost:8080$READY_PATH"
          cat "$RUNNER_TEMP/port-forward.log"
          exit 1

      - name: DAST baseline (OWASP ZAP)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          # -I: warnings are reported but only rules set to FAIL in .zap/rules.tsv fail the build.
          cmd_options: -I
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline

      - name: Collect reports
        if: always()
        run: |
          mkdir -p reports
          if [[ -f report_html.html ]]; then cp report_html.html reports/zap-baseline.html; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all,networkpolicy -n "$NAMESPACE" -o wide || true
          kubectl describe pods -n "$NAMESPACE" || true
          kubectl logs -n "$NAMESPACE" -l "app.kubernetes.io/instance=$RELEASE" --all-containers --tail=200 || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp || true

  publish:
    name: Publish signed image
    needs: ephemeral-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        # GHCR requires lowercase names; the organization login is mixed-case.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # sha-<full commit SHA>: the release workflow promotes exactly this digest.
          tags: type=sha,format=long

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance and SBOM are attached as signed GitHub attestations below instead.
          provenance: false
          sbom: false
          cache-from: type=gha

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  pages:
    name: Publish reports
    needs: ephemeral-deploy
    # Enable by creating the repository variable PUBLISH_REPORTS=true and setting Pages source to "GitHub Actions".
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_REPORTS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: site

      - name: Build index
        run: |
          {
            echo "<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><title>${GITHUB_REPOSITORY} · reports</title>"
            echo "<h1>${GITHUB_REPOSITORY}</h1>"
            echo "<p>Commit <code>${GITHUB_SHA::7}</code> · generated $(date -u +%Y-%m-%dT%H:%MZ)</p><ul>"
            for f in site/*.html; do
              [[ -e "$f" ]] || continue
              name="$(basename "$f")"
              echo "<li><a href=\"$name\">$name</a></li>"
            done
            echo "</ul></html>"
          } > site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
